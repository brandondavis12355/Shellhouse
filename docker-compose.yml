# Self-hosted "AI computer" stack, single-host / single-user local deployment.
# Everything is open-source and free to run. No cloud model calls are made
# anywhere in this codebase — the agent talks ONLY to the local `ollama`
# service below.
#
# PRIVILEGE LAYOUT (see docs/SECURITY.md):
#   sandbox-manager  <- the ONLY container with the Docker socket
#   api              <- runs the agent loop; NO host privilege, NO docker socket
#   sandbox          <- the agent's computer; untrusted by design
#   ollama, web      <- no privilege
#
# Every port is bound to 127.0.0.1. Nothing in this stack is reachable from
# your LAN as shipped.

# Fixed project name, so container, network and volume names (e.g.
# shellhouse_workspace) don't depend on the folder this is checked out into.
name: shellhouse

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  ollama:
    image: ollama/ollama:latest          # Apache-2.0, local inference server
    container_name: agent-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    logging: *default-logging
    # For an NVIDIA GPU (with nvidia-container-toolkit installed), uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Job queue. Agent execution is handed to workers through this, so a task
  # survives an API restart.
  redis:
    image: redis:7-alpine
    container_name: agent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    logging: *default-logging

  # Vector store for semantic memory / evidence retrieval.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"    # dashboard at http://localhost:6333/dashboard
    volumes:
      - qdrant_data:/qdrant/storage
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # The agent's computer: a full Debian 13 desktop (openbox + Thunar +
  # xfce4-terminal + Chromium) streamed over noVNC.
  #
  # Treat this container as compromised-by-default. It runs a browser pointed
  # at arbitrary websites under model control.
  # ---------------------------------------------------------------------------
  sandbox:
    build:
      # Root context (not ./sandbox) so the Dockerfile can seed /home/box and
      # /workspace from the top-level box/ and workspace/ directories —
      # gitignored, not part of the sandbox/ subtree itself.
      context: .
      dockerfile: sandbox/Dockerfile
    # Explicit tag so the Sandbox Manager can start FRESH per-task containers
    # from the same image. Without this, compose picks a project-prefixed name
    # the manager can't predict.
    image: agent-desktop:local
    container_name: agent-sandbox
    restart: unless-stopped
    hostname: shellhouse-vm-local
    ports:
      - "127.0.0.1:6080:6080"    # noVNC for the persistent computer
      # Per-task ephemeral sandboxes get their own ports (6100+), published by
      # the Sandbox Manager at create time, also loopback-only.
    volumes:
      - workspace:/workspace
    shm_size: "1gb"              # Chromium crashes on the default 64MB
    security_opt:
      - seccomp:unconfined       # required for Chromium's own sandbox
      - no-new-privileges:${SANDBOX_NO_NEW_PRIVS:-true}   # nothing inside can gain more than it starts with (set SANDBOX_NO_NEW_PRIVS=false only alongside SANDBOX_ALLOW_SUDO=1)
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT               # Chromium's sandbox needs only this
      - SETUID                   # supervisord (root) drops privilege to `box`
      - SETGID                   # for this and every desktop process to run as
    environment:
      - SCREEN_GEOM=1280x800x24
    tty: true
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Group relay: lets friends' apps share a group chat with you. OFF by
  # default (compose profile "relay"); start it with
  #   docker compose --profile relay up -d --build group-relay
  # Reachable only on RELAY_BIND (default loopback) — set RELAY_BIND to the
  # host's address on the network your friends are on. Needs a TLS cert in
  # ./group-relay/certs (see group-relay/README.md). No Docker socket, no
  # access to sandboxes, bot memory or prompts: it only stores identities,
  # friendships, group membership and the shared message log.
  # ---------------------------------------------------------------------------
  group-relay:
    profiles: ["relay"]
    build:
      context: .
      dockerfile: group-relay/Dockerfile
    container_name: agent-group-relay
    restart: unless-stopped
    ports:
      - "${RELAY_BIND:-127.0.0.1}:${RELAY_PORT:-8443}:8443"
    environment:
      - RELAY_DB=/data/relay.db
      - RELAY_MAX_HUMANS=${RELAY_MAX_HUMANS:-20}
      - "RELAY_REGISTRATION_TOKEN=${RELAY_REGISTRATION_TOKEN:-}"
      - RELAY_ALLOW_PLAINTEXT=${RELAY_ALLOW_PLAINTEXT:-0}
    volumes:
      - relay_data:/data
      - ./group-relay/certs:/certs:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 128
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Egress allowlist proxy. OFF by default (compose profile "egress"). Only
  # used by sandboxes created while the manager runs with
  # SANDBOX_EGRESS_MODE=allowlist; see docs/EGRESS.md for the full procedure
  # (EGRESS_ADMIN_TOKEN must also be set on sandbox-manager; empty = admin
  # interface disabled. No variable here is required, so the file always
  # parses identically whether or not this profile is active).
  #   docker compose --profile egress up -d --build egress-proxy
  # The sandbox-manager attaches this container to each sandbox's internal
  # network at sandbox creation time. noVNC for those sandboxes is forwarded
  # through this container on loopback ports 6100-6131.
  # ---------------------------------------------------------------------------
  egress-proxy:
    profiles: ["egress"]
    build:
      context: .
      dockerfile: egress-proxy/Dockerfile
    container_name: agent-egress-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:6100-6131:6100-6131"      # noVNC forwarders (allowlist mode)
    environment:
      - EGRESS_ADMIN_TOKEN=${EGRESS_ADMIN_TOKEN:-}
      - EGRESS_CANARY_ACTION=${EGRESS_CANARY_ACTION:-deny}
      # Model relay (off unless BOTH are set), e.g. 0.0.0.0:18434 and the Linux
      # host's docker-bridge gateway address:port of the Mac's reverse SSH forward.
      - MODEL_RELAY_LISTEN=${MODEL_RELAY_LISTEN:-}
      - MODEL_RELAY_TARGET=${MODEL_RELAY_TARGET:-}
      - MODEL_RELAY_ALLOW_CIDRS=${MODEL_RELAY_ALLOW_CIDRS:-}
      - EGRESS_VNC_FORWARD=${EGRESS_VNC_FORWARD:-}
      # Source address(es) the forwarder accepts: the gateway of this compose
      # project's default network (docker network inspect <project>_default).
      - EGRESS_VNC_ALLOW_CIDRS=${EGRESS_VNC_ALLOW_CIDRS:-}
    volumes:
      - egress_data:/data                        # allowlist.txt, egress.jsonl, pending.json
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 256
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Sandbox Manager: the single privileged component.
  #
  # It holds the Docker socket so that `api` does not have to. It listens on a
  # unix socket (no TCP), authenticates every call, and will only operate on
  # sandboxes it created itself.
  # ---------------------------------------------------------------------------
  sandbox-manager:
    build:
      context: .
      dockerfile: sandbox-manager/Dockerfile
    container_name: agent-sandbox-manager
    restart: unless-stopped
    # No `ports:` at all. Intentional — there is nothing to expose.
    environment:
      # Quoted: an unquoted plain scalar containing ": " here gets misparsed
      # as a nested mapping by this compose version (compose-go), which fails
      # the whole file with "environment.[0]: unexpected type map[string]interface {}".
      - "MANAGER_TOKEN=${MANAGER_TOKEN:?MANAGER_TOKEN must be set in .env - generate with: openssl rand -hex 32}"
      # 1 = per-bot sandboxes allow passwordless sudo for `box` (drops
      # no-new-privileges, adds back caps root needs for apt). Default off.
      - SANDBOX_ALLOW_SUDO=${SANDBOX_ALLOW_SUDO:-0}
      # 1 (default) = each bot gets its own workspace volume; 0 = legacy shared
      # volume with per-bot subdirectories (needed for the web/API screenshot
      # serving, which reads the shared volume).
      - SANDBOX_PER_BOT_VOLUMES=${SANDBOX_PER_BOT_VOLUMES:-1}
      - MANAGER_SOCKET=/run/sandbox-manager/manager.sock
      - MANAGER_AUDIT_LOG=/var/log/sandbox-manager/audit.log
      - SANDBOX_BACKEND=${SANDBOX_BACKEND:-docker}
      - SANDBOX_CONTAINER_NAME=agent-sandbox
      - SANDBOX_IMAGE=agent-desktop:local
      - SANDBOX_USER=box
      - NOVNC_URL=http://localhost:6080/vnc.html?autoconnect=1&resize=scale
      # Per-task ephemeral sandboxes: host port range and resource ceilings.
      - SANDBOX_PORT_BASE=${SANDBOX_PORT_BASE:-6100}
      - SANDBOX_PORT_COUNT=${SANDBOX_PORT_COUNT:-32}
      - SANDBOX_MEM_LIMIT=${SANDBOX_MEM_LIMIT:-2g}
      - SANDBOX_CPU_LIMIT=${SANDBOX_CPU_LIMIT:-2}
      - SANDBOX_PIDS_LIMIT=${SANDBOX_PIDS_LIMIT:-512}
      # Persistent (per-bot) sandboxes: separate, more generous ceilings.
      - SANDBOX_PERSISTENT_LIMITS=${SANDBOX_PERSISTENT_LIMITS:-0}   # 1 = use the PERSISTENT limits below
      - SANDBOX_PERSISTENT_MEM_LIMIT=${SANDBOX_PERSISTENT_MEM_LIMIT:-4g}
      - SANDBOX_PERSISTENT_CPU_LIMIT=${SANDBOX_PERSISTENT_CPU_LIMIT:-4}
      - SANDBOX_PERSISTENT_PIDS_LIMIT=${SANDBOX_PERSISTENT_PIDS_LIMIT:-1024}
      - SANDBOX_PERSISTENT_STORAGE_LIMIT=${SANDBOX_PERSISTENT_STORAGE_LIMIT:-}
      # Opt-in egress control (docs/EGRESS.md): "open" (default) or "allowlist".
      - SANDBOX_EGRESS_MODE=${SANDBOX_EGRESS_MODE:-open}
      - EGRESS_ADMIN_TOKEN=${EGRESS_ADMIN_TOKEN:-}
      - SANDBOX_SEED_CANARIES=${SANDBOX_SEED_CANARIES:-0}
      # Name of the docker volume to mount into per-task sandboxes. Must match
      # the actual volume name: `docker volume ls | grep workspace`.
      - WORKSPACE_VOLUME=${WORKSPACE_VOLUME:-shellhouse_workspace}
      # Firecracker backend only; ignored when SANDBOX_BACKEND=docker.
      - FIRECRACKER_VCPUS=${FIRECRACKER_VCPUS:-2}
      - FIRECRACKER_MEM_MIB=${FIRECRACKER_MEM_MIB:-2048}
      - FIRECRACKER_KERNEL=/var/lib/agent-vm/vmlinux
      - FIRECRACKER_ROOTFS=/var/lib/agent-vm/rootfs.ext4
    # Runs as the host user (not root) so the socket below is created with
    # that user's ownership — needed if anything outside Docker (e.g. an
    # SSH-tunneled remote client) needs to connect to it directly. The Mac app
    # does exactly that (README.md › Linux host setup). ./setup.sh fills these in from `id -u`/`id -g`.
    user: "${MANAGER_SOCKET_UID:-1000}:${MANAGER_SOCKET_GID:-1000}"
    volumes:
      # A host bind mount, not a named volume: a named volume's backing path
      # is Docker-internal and normally root-owned, which an external SSH
      # tunnel (running as a regular user) can't reach. This one lives at a
      # plain host path `user:` above can own outright.
      - ${MANAGER_SOCKET_HOST_DIR:-./sandbox-manager-run}:/run/sandbox-manager
      - manager_logs:/var/log/sandbox-manager     # audit log
      - workspace:/workspace                      # for read_file/write_file
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Firecracker backend additionally needs /dev/kvm and /var/lib/agent-vm;
      # see docs/SECURITY.md — running the manager as a host systemd unit is
      # the better option in that case.
    group_add:
      - "${DOCKER_GID:-999}"    # read the socket via group, not as root
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # API + agent runtime. This is the process that reads untrusted web pages
  # and executes model-chosen tool calls, so it gets nothing:
  # no docker socket, no host mounts, no added capabilities.
  # ---------------------------------------------------------------------------
  api:
    build: ./api
    container_name: agent-api
    restart: unless-stopped
    depends_on:
      - ollama
      - redis
      - qdrant
      - sandbox-manager
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - EMBED_DIM=${EMBED_DIM:-768}
      - MEMORY_ENABLED=${MEMORY_ENABLED:-true}
      - MCP_ENABLED=${MCP_ENABLED:-true}
      - MCP_CONFIG_PATH=/data/mcp_servers.json
      # Encrypts stored credentials. Empty = credential storage disabled.
      - SECRETS_KEY=${SECRETS_KEY:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      - DATABASE_URL=sqlite:////data/agent.db
      - MANAGER_SOCKET=/run/sandbox-manager/manager.sock
      - MANAGER_TOKEN=${MANAGER_TOKEN:?MANAGER_TOKEN must be set in .env}
      - NOVNC_URL=http://localhost:6080/vnc.html?autoconnect=1&resize=scale
      - SANDBOX_CONTAINER_NAME=agent-sandbox
      # Task budgets (fix 2). Every one of these ends a task cleanly with a
      # recorded reason rather than letting it run forever.
      - TASK_MAX_ITERATIONS=${TASK_MAX_ITERATIONS:-40}
      - TASK_MAX_SECONDS=${TASK_MAX_SECONDS:-1800}
      - TASK_MAX_TOKENS=${TASK_MAX_TOKENS:-200000}
      - MODEL_TIMEOUT_SECONDS=${MODEL_TIMEOUT_SECONDS:-600}
      # Vision (fix 3): screenshots are shown to the model only if its name
      # matches one of these hints.
      - VISION_MODEL_HINTS=${VISION_MODEL_HINTS:-vl,vision,llava,bakllava,moondream,minicpm-v,gemma3,qwen2.5vl}
    volumes:
      - api_data:/data
      - ${MANAGER_SOCKET_HOST_DIR:-./sandbox-manager-run}:/run/sandbox-manager:ro   # the socket, and nothing else
      - workspace:/workspace                     # serve screenshots to the UI
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Agent workers: where the agent loop actually runs. Same image as the API,
  # different entrypoint. Scale with: docker compose up -d --scale worker=3
  # ---------------------------------------------------------------------------
  worker:
    build: ./api
    restart: unless-stopped
    depends_on:
      - ollama
      - redis
      - qdrant
      - sandbox-manager
    command: ["python", "worker.py"]
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      - DATABASE_URL=sqlite:////data/agent.db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - MANAGER_SOCKET=/run/sandbox-manager/manager.sock
      - MANAGER_TOKEN=${MANAGER_TOKEN:?MANAGER_TOKEN must be set in .env}
      - SANDBOX_CONTAINER_NAME=agent-sandbox
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - EMBED_DIM=${EMBED_DIM:-768}
      - MEMORY_ENABLED=${MEMORY_ENABLED:-true}
      - MEMORY_RECALL_LIMIT=${MEMORY_RECALL_LIMIT:-5}
      - AUTO_EVIDENCE=${AUTO_EVIDENCE:-true}
      - MCP_ENABLED=${MCP_ENABLED:-true}
      - MCP_CONFIG_PATH=/data/mcp_servers.json
      - SECRETS_KEY=${SECRETS_KEY:-}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      # Budgets
      - TASK_MAX_ITERATIONS=${TASK_MAX_ITERATIONS:-40}
      - TASK_MAX_SECONDS=${TASK_MAX_SECONDS:-1800}
      - TASK_MAX_TOKENS=${TASK_MAX_TOKENS:-200000}
      - MODEL_TIMEOUT_SECONDS=${MODEL_TIMEOUT_SECONDS:-600}
      - VISION_MODEL_HINTS=${VISION_MODEL_HINTS:-vl,vision,llava,bakllava,moondream,minicpm-v,gemma3,qwen2.5vl}
    volumes:
      - api_data:/data                            # shared task database
      - ${MANAGER_SOCKET_HOST_DIR:-./sandbox-manager-run}:/run/sandbox-manager:ro    # the socket, and nothing else
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  web:
    build: ./web
    container_name: agent-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:80"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

volumes:
  egress_data:
  relay_data:
  ollama_models:
  api_data:
  workspace:
  manager_logs:
  redis_data:
  qdrant_data:
