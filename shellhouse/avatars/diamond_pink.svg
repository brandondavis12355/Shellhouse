<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-opacity=".25"/></filter>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EC4899"/><stop offset="1" stop-color="#EC4899" stop-opacity=".72"/></linearGradient></defs>
<g class="avatar" filter="url(#s)"><g class="body" style="animation-duration:2.2s;animation-delay:-0.38s"><g fill="url(#g)"><rect x="20" y="20" width="60" height="60" rx="8" transform="rotate(-5 50 50)"/></g>
<g class="eyes"><rect x="35" y="43" width="7" height="14" rx="3.5" fill="white"/><rect x="58" y="43" width="7" height="14" rx="3.5" fill="white"/></g></g></g>
<style>
.avatar{transform-box:fill-box;transform-origin:center}
.body{transform-box:fill-box;transform-origin:center;animation:move 2.2s ease-in-out infinite}
.eyes{transform-origin:center;animation:blink 3.30s infinite}
@keyframes move{0%,100%{transform:rotate(-5deg) translateX(-2px)}50%{transform:rotate(5deg) translateX(2px)}}
@keyframes blink{0%,89%,100%{transform:scaleY(1)}92%{transform:scaleY(.08)}95%{transform:scaleY(1)}}
</style></svg>