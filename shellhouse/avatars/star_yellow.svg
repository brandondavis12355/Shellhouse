<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-opacity=".25"/></filter>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EAB308"/><stop offset="1" stop-color="#EAB308" stop-opacity=".72"/></linearGradient></defs>
<g class="avatar" filter="url(#s)"><g class="body" style="animation-duration:2.4s;animation-delay:-0.45s"><g fill="url(#g)"><polygon points="50.0,12.0 60.0,36.2 86.1,38.3 66.2,55.3 72.3,80.7 50.0,67.0 27.7,80.7 33.8,55.3 13.9,38.3 40.0,36.2"/></g>
<g class="eyes"><rect x="35" y="43" width="7" height="14" rx="3.5" fill="white"/><rect x="58" y="43" width="7" height="14" rx="3.5" fill="white"/></g></g></g>
<style>
.avatar{transform-box:fill-box;transform-origin:center}
.body{transform-box:fill-box;transform-origin:center;animation:move 2.4s ease-in-out infinite}
.eyes{transform-origin:center;animation:blink 4.71s infinite}
@keyframes move{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-8px) rotate(-5deg)}60%{transform:translateY(0) rotate(5deg)}}
@keyframes blink{0%,89%,100%{transform:scaleY(1)}92%{transform:scaleY(.08)}95%{transform:scaleY(1)}}
</style></svg>