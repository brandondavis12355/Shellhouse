<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-opacity=".25"/></filter>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22C55E"/><stop offset="1" stop-color="#22C55E" stop-opacity=".72"/></linearGradient></defs>
<g class="avatar" filter="url(#s)"><g class="body" style="animation-duration:1.7s;animation-delay:-0.66s"><g fill="url(#g)"><rect x="22" y="22" width="56" height="56" rx="5" transform="rotate(-5 50 50)"/></g>
<g class="eyes"><rect x="35" y="43" width="7" height="14" rx="3.5" fill="white"/><rect x="58" y="43" width="7" height="14" rx="3.5" fill="white"/></g></g></g>
<style>
.avatar{transform-box:fill-box;transform-origin:center}
.body{transform-box:fill-box;transform-origin:center;animation:move 1.7s ease-in-out infinite}
.eyes{transform-origin:center;animation:blink 4.24s infinite}
@keyframes move{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes blink{0%,89%,100%{transform:scaleY(1)}92%{transform:scaleY(.08)}95%{transform:scaleY(1)}}
</style></svg>