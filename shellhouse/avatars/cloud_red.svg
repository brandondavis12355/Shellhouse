<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EF4444"/><stop offset="1" stop-color="#EF4444" stop-opacity=".72"/></linearGradient></defs>
<g class="avatar" filter="url(#s)"><g class="body" style="animation-duration:2.8s;animation-delay:-0.64s"><g fill="url(#g)"><path d="M28 70 C17 69 13 60 17 52 C20 45 27 42 34 43 C37 29 48 23 59 27 C67 29 72 35 73 43 C82 43 87 49 87 57 C87 65 80 71 71 71 Z"/></g>
<g class="eyes"><rect x="35" y="43" width="7" height="14" rx="3.5" fill="white"/><rect x="58" y="43" width="7" height="14" rx="3.5" fill="white"/></g></g></g>
<style>
