[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_SCREEN_GEOM)s -ac +extension GLX +render -noreset
autorestart=true
priority=100
stdout_logfile=/var/log/xvfb.log
stderr_logfile=/var/log/xvfb.err

[program:openbox]
command=/usr/local/bin/start-desktop.sh
user=box
environment=DISPLAY=":1",HOME="/home/box",USER="box"
autorestart=true
priority=200
stdout_logfile=/var/log/desktop.log
stderr_logfile=/var/log/desktop.err

; Raw VNC server bound to loopback inside the container only.
; noVNC/websockify is the single thing that fronts it.
[program:x11vnc]
command=/usr/local/bin/start-x11vnc.sh
autorestart=true
priority=300
stdout_logfile=/var/log/x11vnc.log
stderr_logfile=/var/log/x11vnc.err

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
priority=400
stdout_logfile=/var/log/novnc.log
stderr_logfile=/var/log/novnc.err
